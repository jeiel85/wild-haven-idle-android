# Play용 AAB를 CI에서 빌드해 Play 테스트 트랙(현재 alpha = 비공개 테스트)에 올립니다(README "Play 업로드").
#
# - 태그 v<x.y.z>가 올라오면 그 버전을 올립니다. 같은 태그로 Android Release(GitHub 릴리스, APK)도 따로 돕니다.
# - Actions 화면에서 손으로 돌릴 수도 있습니다(version 입력). dry_run을 켜면 빌드·서명 확인·트랙 조회까지만 하고 올리지 않습니다.
# 비밀값은 GitHub 환경 'play'에만 있고, 그 환경은 jeiel85의 승인을 받아야 실행됩니다(main 브랜치·v* 태그만).
name: Play release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (x.y.z, app/build.gradle.kts versionName과 같고 store-release-notes/v<x.y.z>.txt가 있어야 함)'
        required: true
      dry_run:
        description: '올리지 않고 빌드·서명 확인·트랙 조회만'
        type: boolean
        default: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 40
    env:
      PACKAGE: com.jeiel85.wildhavenidle
      # Play 업로드 키 인증서(.keystore/wild-haven-release.jks, alias wild-haven-release).
      # 다른 키로 서명된 번들은 올리기 전에 멈춥니다.
      UPLOAD_CERT_SHA256: 'D6:75:4C:42:57:B8:55:02:8A:74:D6:28:F7:80:62:8F:D6:B9:87:0A:E5:41:B9:2E:12:03:40:A4:C0:0B:7C:A5'
      # 올릴 트랙. 첫 트랙에 번들을 올리고, 나머지 트랙에는 같은 versionCode를 붙입니다.
      TRACKS: 'alpha'
    steps:
      - uses: actions/checkout@v6

      - name: 버전 정하기
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$INPUT_VERSION"; fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::버전은 x.y.z여야 합니다: $VER"; exit 1; }
          NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          [ "$NAME" = "$VER" ] || { echo "::error::app/build.gradle.kts versionName($NAME)이 $VER과 다릅니다"; exit 1; }
          [[ "$CODE" =~ ^[0-9]+$ ]] || { echo "::error::versionCode를 읽지 못했습니다"; exit 1; }
          [ -f "store-release-notes/v$VER.txt" ] || { echo "::error::store-release-notes/v$VER.txt가 없습니다"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "dry=${DRY:-false}" >> "$GITHUB_OUTPUT"
          echo "버전 $VER, versionCode $CODE"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4

      - name: Android SDK 구성요소
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 서명 키 놓기
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/keystore/wild-haven-release.jks"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$KEYSTORE_FILE")"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          [ -s "$KEYSTORE_FILE" ]

      - name: 시험
        run: ./gradlew test

      - name: AAB 빌드
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_RELEASE_KEYSTORE_PATH="$KEYSTORE_FILE"
          ./gradlew bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -s "$AAB" ] || { echo "::error::$AAB가 없습니다"; exit 1; }
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: 키스토어 인증서 확인
        env:
          SP: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          GOT=$(keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_FILE" -alias "$ALIAS" -storepass:env SP | sed -nE 's/^[[:space:]]*SHA256: *//p' | head -n1)
          [ "$GOT" = "$UPLOAD_CERT_SHA256" ] || { echo "::error::키스토어 인증서가 Play 업로드 키와 다릅니다: $GOT"; exit 1; }
          echo "키스토어 인증서 SHA-256 일치"

      - name: 출시 노트(store-release-notes에서)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          python3 - "store-release-notes/v$VER.txt" <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding="utf-8").read()
          for tag, out in (("ko-KR", "dist/notes-ko.txt"), ("en-US", "dist/notes-en.txt")):
              m = re.search(rf"<{tag}>\s*(.*?)\s*</{tag}>", s, re.S)
              if not m:
                  sys.exit(f"::error::{sys.argv[1]}에 <{tag}> 블록이 없습니다")
              body = m.group(1).strip()
              if len(body) > 500:
                  sys.exit(f"::error::{tag} 출시 노트가 {len(body)}자입니다(Play 한도 500자)")
              open(out, "w", encoding="utf-8").write(body)
              print(f"{tag}: {len(body)}자")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: wild-haven-idle-play-${{ steps.ver.outputs.version }}
          path: |
            ${{ env.AAB }}
            dist/notes-ko.txt
            dist/notes-en.txt
          retention-days: 30

      - name: Play 트랙 상태(올리기 전)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: Play 트랙에 올리기
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CODE: ${{ steps.ver.outputs.code }}
          DRY: ${{ steps.ver.outputs.dry }}
        run: |
          DRYFLAG=(); [ "$DRY" = true ] && DRYFLAG=(-DryRun)
          NOTES=(-NotesKoFile dist/notes-ko.txt -NotesEnFile dist/notes-en.txt)
          FIRST=1
          for T in $TRACKS; do
            if [ "$FIRST" = 1 ]; then
              pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track "$T" -AabPath "$AAB" \
                -ExpectedUploadCertSha256 "$UPLOAD_CERT_SHA256" -ExpectedVersionCode "$CODE" "${NOTES[@]}" "${DRYFLAG[@]}"
              FIRST=0
            else
              pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track "$T" -ExpectedVersionCode "$CODE" \
                "${NOTES[@]}" "${DRYFLAG[@]}"
            fi
          done

      - name: Play 트랙 상태(올린 뒤)
        if: steps.ver.outputs.dry != 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 키 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
